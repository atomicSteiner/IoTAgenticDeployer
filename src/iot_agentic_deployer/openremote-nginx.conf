# For the browser only. The console asks for Keycloak on its own origin, and
# the Keycloak client that ships with OpenRemote accepts one address to come
# back to: https://localhost. So the human needs manager and Keycloak behind
# one TLS origin, self-signed here because a local test needs no more.
#
# The adapter needs none of this: a service user's client credentials involve
# no redirect, so it talks plain HTTP to the two ports directly.
server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /certs/tls.crt;
    ssl_certificate_key /certs/tls.key;

    location /auth/ {
        proxy_pass http://openremote-keycloak:8080/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
    }

    location / {
        proxy_pass http://openremote:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
