[project]
name = "iot_agentic_deployer"
version = "0.1.0"
description = "Agentic AI IoT deployer"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.3.10",
    "langchain-anthropic>=1.4.6",
    "langchain-core>=1.4.9",
    "langchain-mcp-adapters>=0.3.1",
    "langchain-openai>=1.3.4",
    "langgraph>=1.0.0",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "mcp>=1.28,<2",
    "pandas-stubs~=3.0.5",
    "pydantic>=2.12.5",
    "python-dotenv>=1.0.1",
    "requests>=2.33.0",
    "streamlit",
]

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.7.0",
    "langgraph-cli[inmem]>=0.4.10",
    "pytest>=9.0.3",
    "ruff>=0.8.0",
]

[tool.uv.build-backend]
module-name = "iot_agentic_deployer"
source-include = ["langgraph.json", ".env.example", "Makefile", "tests/**"]
